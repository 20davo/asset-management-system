name: CD

on:
  workflow_dispatch:

concurrency:
  group: cd-demo
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  api:
    name: Deploy API to App Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: api/AssetManagement/AssetManagement.Api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Point App Service to the new image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.API_IMAGE }}:${{ github.sha }}

  frontend:
    name: Deploy frontend to Static Web Apps
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
      url: ${{ vars.DEMO_FRONTEND_URL }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend in demo mode
        run: npm run build -- --mode demo
        env:
          VITE_API_BASE_URL: ${{ vars.DEMO_API_URL }}/api

      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true

  smoke:
    name: Smoke test
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    permissions: {}

    steps:
      - name: Frontend and a deep link respond
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-all-errors --retry-delay 10 "${{ vars.DEMO_FRONTEND_URL }}/"
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-all-errors --retry-delay 10 "${{ vars.DEMO_FRONTEND_URL }}/equipment/1"

      # The first start after a deploy pulls the image and can take several minutes on F1.
      - name: API serves the Swagger document
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null --max-time 30 "${{ vars.DEMO_API_URL }}/swagger/v1/swagger.json"; then
              echo "API is up after attempt $attempt"
              exit 0
            fi
            sleep 20
          done
          echo "API did not respond in time"
          exit 1

      - name: API rejects requests without a token
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "${{ vars.DEMO_API_URL }}/api/equipment")
          echo "Status: $status"
          test "$status" = "401"
