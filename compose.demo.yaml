# Demo mode on your machine, as its own project next to the normal stack.
# Usage: docker compose -f compose.demo.yaml up --build
# Frontend: http://localhost:5174, API: http://localhost:5072
# Own containers and volumes, so your local data is not touched.
name: ams-demo

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: asset_management_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asset_management_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api/AssetManagement/AssetManagement.Api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=asset_management_demo;Username=postgres;Password=postgres
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set in the root .env file}
      Storage__UploadsPath: /app/demo-data/uploads
      Demo__StatePath: /app/demo-data/state
      DataProtection__KeysPath: /app/demo-data/dp-keys
      Cors__AllowedOrigins__0: http://localhost:5174
    ports:
      - "5072:8080"
    volumes:
      - demo_data:/app/demo-data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        BUILD_MODE: demo
        VITE_API_BASE_URL: http://localhost:5072/api
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  demo_postgres_data:
  demo_data:
